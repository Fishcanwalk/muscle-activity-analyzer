[platformio]
default_envs = esp32_wifi

; ------------------------------------------------------------------------------
; Common Libraries & Configurations
; ------------------------------------------------------------------------------
[common]
monitor_speed = 115200
lib_deps =
    Wire
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    adafruit/Adafruit MLX90614 Library @ ^2.1.5

; ==============================================================================
; 1. ESP32 Environments (3.3V Logic)
; ==============================================================================
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

[env:esp32_i2c_scanner]
extends = esp32_base
build_src_filter = +<01_i2c_scanner.cpp>

[env:esp32_semg]
extends = esp32_base
build_src_filter = +<02_semg_adc_test.cpp>

[env:esp32_fsr]
extends = esp32_base
build_src_filter = +<03_fsr_test.cpp>

[env:esp32_mpu6050]
extends = esp32_base
build_src_filter = +<04_mpu6050_test.cpp>

[env:esp32_max30102]
extends = esp32_base
build_src_filter = +<05_max30102_test.cpp>

[env:esp32_mlx90614]
extends = esp32_base
build_src_filter = +<06_mlx90614_test.cpp>

[env:esp32_all]
extends = esp32_base
build_src_filter = +<07_all_diagnostics.cpp>

[env:esp32_wifi]
extends = esp32_base
build_src_filter = +<esp32_connectToWifi.cpp>


; ==============================================================================
; 2. ESP8266 Environments (NodeMCU / D1 Mini - 3.3V Logic)
; ==============================================================================
[esp8266_base]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

[env:esp8266_i2c_scanner]
extends = esp8266_base
build_src_filter = +<01_i2c_scanner.cpp>

[env:esp8266_semg]
extends = esp8266_base
build_src_filter = +<02_semg_adc_test.cpp>

[env:esp8266_fsr]
extends = esp8266_base
build_src_filter = +<03_fsr_test.cpp>

[env:esp8266_mpu6050]
extends = esp8266_base
build_src_filter = +<04_mpu6050_test.cpp>

[env:esp8266_max30102]
extends = esp8266_base
build_src_filter = +<05_max30102_test.cpp>

[env:esp8266_mlx90614]
extends = esp8266_base
build_src_filter = +<06_mlx90614_test.cpp>

[env:esp8266_all]
extends = esp8266_base
build_src_filter = +<07_all_diagnostics.cpp>

; ==============================================================================
; 3. Arduino Uno / Nano Environments (ATmega328P - 5.0V Logic)
; ==============================================================================
[uno_base]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

[env:uno_i2c_scanner]
extends = uno_base
build_src_filter = +<01_i2c_scanner.cpp>

[env:uno_semg]
extends = uno_base
build_src_filter = +<02_semg_adc_test.cpp>

[env:uno_fsr]
extends = uno_base
build_src_filter = +<03_fsr_test.cpp>

[env:uno_mpu6050]
extends = uno_base
build_src_filter = +<04_mpu6050_test.cpp>

[env:uno_max30102]
extends = uno_base
build_src_filter = +<05_max30102_test.cpp>

[env:uno_mlx90614]
extends = uno_base
build_src_filter = +<06_mlx90614_test.cpp>

[env:uno_all]
extends = uno_base
build_src_filter = +<07_all_diagnostics.cpp>
