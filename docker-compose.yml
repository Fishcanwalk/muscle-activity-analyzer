services:
  mongo:
    image: mongo:7
    container_name: muscle_analyzer_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: muscle_analyzer_backend
    ports:
      - "5001:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: muscle_activity_analyzer
      FLASK_PORT: 5000
      CORS_ORIGINS: http://localhost:5050
    depends_on:
      - mongo

volumes:
  mongo_data:
