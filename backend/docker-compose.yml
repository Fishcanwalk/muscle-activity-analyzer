services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/cyberpump
    depends_on:
      - mongo

volumes:
  mongo_data:
